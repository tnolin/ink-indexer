title = "ink-indexer gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Recorded mainnet fixtures and tests hold public on-chain addresses and hashes in fields like `token` and `conduitKey`, and tests use fixed fake keys; the generic-api-key rule flags both."
paths = [
  '''packages/sdk/test/fixtures/.*\.json''',
  '''apps/indexer/test/fixtures/.*\.json''',
]
# A 20-byte address is public by definition. 32-byte hex values stay flagged outside fixtures, since a private key has that shape.
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^test-key-0123456789abcdef$''',
  '''^osKey0123456789$''',
]
