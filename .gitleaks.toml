title = "ink-indexer gitleaks config"

[extend]
useDefault = true

# Recorded mainnet fixtures and tests hold public on-chain addresses and hashes in fields like `token`
# and `conduitKey`, and tests use fixed fake keys; generic-api-key flags both. This allowlist skips
# generic-api-key only, so the fixture-credential rule below still scans the fixtures.
[[allowlists]]
description = "Public on-chain values in fixtures and fake test keys"
targetRules = ["generic-api-key"]
paths = [
  '''packages/sdk/test/fixtures/.*\.json''',
  '''apps/indexer/test/fixtures/.*\.json''',
]
# A 20-byte address is public by definition. 32-byte hex values stay flagged outside fixtures, since a
# private key has that shape.
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^test-key-0123456789abcdef$''',
  '''^osKey0123456789$''',
]

# A recorded fixture must never hold a credential or an auth exchange (see fixtures-no-keys.test.ts).
[[rules]]
id = "fixture-credential"
description = "Credential or auth exchange in a recorded fixture"
path = '''(^|/)test/fixtures/.*\.json$'''
regex = '''(?i)(token=|x-api-key|api[_-]?key|authorization|bearer\s|/auth/keys)'''
